name: Verify pinned CA bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/test_ca_bundle.py
